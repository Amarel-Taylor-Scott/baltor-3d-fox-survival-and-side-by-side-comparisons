<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>With Baltor · Loop Engine Flexible Solution-Graph & Swappable Engine Slots</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#061014;color:#ecfdf5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}
.hud{display:none!important}
.ok{color:#6ee7b7;font-weight:700}
.gold{color:#f4ac5e;font-weight:700}
.dock{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(6,18,22,0.92);border:1px solid rgba(52,211,153,0.35);padding:6px 12px;border-radius:999px;font-size:10.5px;z-index:10;flex-wrap:wrap}
.ebtns{display:flex;gap:6px}
.ebtn{background:#0f292e;color:#d1fae5;border:1px solid #10b981;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer}
.ebtn.active{background:#10b981;color:#041812}
</style>
</head>
<body>
<div class="hud">
  <span>Active Engine: <b class="gold" id="engLabel">Baltor Native Engine (v1)</b> · Envelope: <b class="ok">7-Layer Typed Edge PASS</b></span>
</div>
<canvas id="c"></canvas>
<div class="dock">
  <div class="ebtns">
    <button class="ebtn active" data-eng="0">Engine A: Baltor Native (Rust/JS)</button>
    <button class="ebtn" data-eng="1">Engine B: Pinned GitHub Container</button>
    <button class="ebtn" data-eng="2">Engine C: Ollama Cloud Gemma 4</button>
  </div>
  <span style="color:#94a3b8">Click any Loop vertex or button above to hot-swap engines without changing typed edges!</span>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=800,H=500;
function rs(){W=canvas.width=window.innerWidth||800;H=canvas.height=window.innerHeight||500;}
window.addEventListener('resize',rs);rs();

const ENGINES=[
  {name:'Baltor Native Engine (v1)',tag:'NATIVE · 2.1ms',col:'#10b981'},
  {name:'Pinned GitHub Container Adapter',tag:'CONTAINER · SHA-Pinned',col:'#f4ac5e'},
  {name:'Ollama Cloud Gemma 4 Hybrid',tag:'HYBRID · Verified',col:'#38bdf8'}
];
let activeEng=0;

const nodes=[
  {id:'discover',label:'01 DISCOVER',role:'Practitioner Loop',sub:'Contract Cards Only',u:0.12,v:0.50},
  {id:'select',label:'02 SELECT',role:'Intelligence Loop',sub:'Slot Order + Evidence',u:0.30,v:0.28},
  {id:'materialize',label:'03 MATERIALIZE',role:'Solution Loop',sub:'CAS Content-Addressed',u:0.30,v:0.72},
  {id:'execute',label:'04 EXECUTE SLOT',role:'Swappable Engine',sub:'Fixed Typed Edge v1',u:0.56,v:0.50,swappable:true},
  {id:'verify',label:'05 VERIFY GATE',role:'Conformance Kit',sub:'7-Layer Envelope',u:0.77,v:0.32},
  {id:'accept',label:'06 ACCEPT & PROMOTE',role:'Immutable Receipt',sub:'Zero Caller Edits',u:0.86,v:0.68}
];
const edges=[[0,1],[0,2],[1,3],[2,3],[3,4],[4,5],[3,5]];

function selectEngine(idx){
  activeEng=idx;
  document.querySelectorAll('.ebtn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('engLabel').textContent=ENGINES[idx].name;
}
document.querySelectorAll('.ebtn').forEach(btn=>{
  btn.onclick=()=>selectEngine(Number(btn.dataset.eng));
});
canvas.addEventListener('pointerdown',()=>{selectEngine((activeEng+1)%ENGINES.length);});

let t=0;
function loop(){
  t+=0.016;
  ctx.fillStyle='#061014';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(52,211,153,0.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  const eng=ENGINES[activeEng];

  // Draw typed edges & animated contract pulses
  edges.forEach(([a,b],idx)=>{
    const n1=nodes[a],n2=nodes[b];
    const x1=n1.u*W,y1=n1.v*H,x2=n2.u*W,y2=n2.v*H;
    ctx.strokeStyle='rgba(110,231,183,0.32)';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();

    const p=((t*0.65+idx*0.19)%1);
    const px=x1+(x2-x1)*p,py=y1+(y2-y1)*p;
    ctx.fillStyle=eng.col;
    ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill();
  });

  // Draw Loop vertices
  nodes.forEach(n=>{
    const x=n.u*W,y=n.v*H,w=148,h=64;
    const col=n.swappable?eng.col:'#10b981';
    ctx.fillStyle=n.swappable?'rgba(16,42,46,0.96)':'rgba(9,24,29,0.92)';
    ctx.strokeStyle=col;ctx.lineWidth=n.swappable?2.8:1.8;
    ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,9);ctx.fill();ctx.stroke();

    ctx.fillStyle=col;ctx.font='700 10.5px ui-monospace,monospace';ctx.textAlign='center';
    ctx.fillText(n.label,x,y-12);
    ctx.fillStyle='#f8fafc';ctx.font='600 10px ui-monospace,monospace';
    ctx.fillText(n.swappable?eng.tag:n.role,x,y+4);
    ctx.fillStyle='#94a3b8';ctx.font='9px ui-monospace,monospace';
    ctx.fillText(n.sub,x,y+19);
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
