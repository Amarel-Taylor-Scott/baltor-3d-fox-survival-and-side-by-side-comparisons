<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Without Baltor · Unbanked Flat Track Box</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
canvas{display:block;width:100vw;height:100vh}
.hud{display:none!important}
.err{color:#fca5a5;font-weight:700}
</style>
</head>
<body>
<div class="hud">
  <span>Banking: <b class="err">0.0° (Flat)</b> · Suspension: <b class="err">None (Rigid)</b> · Off-Track Clips: <b class="err" id="clips">8</b></span>
</div>
<script type="module">
import * as THREE from "/foxglade-living-wood/vendor/three/three.module.js";
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x94a3b8);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,500);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(20,40,10);scene.add(dir);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x78716c}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const track=new THREE.Mesh(new THREE.RingGeometry(30,42,24),new THREE.MeshBasicMaterial({color:0x374151,side:THREE.DoubleSide}));
track.rotation.x=-Math.PI/2;track.position.y=0.05;scene.add(track);

const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.8,3.6),new THREE.MeshLambertMaterial({color:0xef4444}));
body.position.y=0.6;car.add(body);
const top=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,1.8),new THREE.MeshLambertMaterial({color:0x1f2937}));
top.position.set(0,1.2,-0.2);car.add(top);
scene.add(car);

for(let i=0;i<16;i++){
  const a=(i/16)*Math.PI*2,r=i%2===0?24:48;
  const box=new THREE.Mesh(new THREE.BoxGeometry(4,5,4),new THREE.MeshLambertMaterial({color:0x57534e}));
  box.position.set(Math.cos(a)*r,2.5,Math.sin(a)*r);
  scene.add(box);
}

let t=0,clips=8;
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
function animate(){
  t+=0.016;
  const r=36+Math.sin(t*2.7)*9.5; // slides off unbanked corners!
  if(r>42&&Math.random()<0.06){clips++;document.getElementById('clips').textContent=clips;}
  car.position.set(Math.cos(t*0.75)*r,0,Math.sin(t*0.75)*r);
  car.rotation.y=-t*0.75+Math.sin(t*3)*0.25;
  const camOff=new THREE.Vector3(0,6.5,13).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
  camera.position.copy(car.position).add(camOff);
  camera.lookAt(car.position.x,car.position.y+1,car.position.z);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
