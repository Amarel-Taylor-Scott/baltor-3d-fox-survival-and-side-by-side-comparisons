<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Without Baltor · Raw LLM bpy Blind Primitives</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1e1e22;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e5e7eb}
canvas{display:block;width:100vw;height:100vh}
.hud{display:none!important}
.err{color:#fca5a5;font-weight:700}
.log{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(15,15,18,0.92);border:1px solid #3f3f46;padding:8px 12px;border-radius:6px;font-size:10.5px;color:#a1a1aa}
</style>
</head>
<body>
<div class="hud">
  <span>Manifold Check: <b class="err">FAIL (28 Open Edges)</b> · Subdiv: <b class="err">0</b> · Z-Fighting: <b class="err">SEVERE</b></span>
</div>
<div class="log">
  <span style="color:#f87171">bpy.ops.mesh.primitive_cube_add(location=(0,0,0))</span> · LLM guessed coordinates blindly without spatial bounds or Geometry Nodes graph → overlapping flat-shaded primitives.
</div>
<script type="module">
import * as THREE from "/foxglade-living-wood/vendor/three/three.module.js";
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x27272a);
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(4.5,3.6,5.2);camera.lookAt(0,0.4,0);

scene.add(new THREE.GridHelper(10,10,0xef4444,0x3f3f46));
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const d=new THREE.DirectionalLight(0xffffff,0.8);d.position.set(5,8,4);scene.add(d);

// Awkwardly colliding un-subdivided gray primitives at (0,0,0)
const grp=new THREE.Group();
const mat1=new THREE.MeshLambertMaterial({color:0x9ca3af,flatShading:true});
const mat2=new THREE.MeshLambertMaterial({color:0x71717a,flatShading:true});
const errWire=new THREE.LineBasicMaterial({color:0xef4444});

const c1=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8),mat1);
c1.position.set(0,0.5,0);
const c2=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.9,1.4),mat2);
c2.position.set(0.3,0.7,0.2);c2.rotation.set(0.2,0.4,-0.15);
const cyl1=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,2.4,8),mat1);
cyl1.position.set(-0.2,0.8,-0.1);cyl1.rotation.z=0.35;
const cone1=new THREE.Mesh(new THREE.ConeGeometry(1.2,1.9,6),mat2);
cone1.position.set(0.1,1.3,0.1);

[c1,c2,cyl1,cone1].forEach(m=>{
  grp.add(m);
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),errWire));
});
scene.add(grp);

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
let t=0;
function animate(){
  t+=0.012;
  grp.rotation.y=t*0.5;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
